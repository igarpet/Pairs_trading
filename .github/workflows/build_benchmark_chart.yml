name: Build strategy benchmark chart

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_benchmark_chart.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow matplotlib
      - name: Build benchmark chart
        run: |
          python - <<'PY'
          import pandas as pd
          import matplotlib.pyplot as plt
          from pathlib import Path

          eq = pd.read_parquet('data/processed/equity_curve.parquet').copy()
          sp = pd.read_parquet('data/processed/systematic_risk/sp500_prices.parquet').copy()

          def normalize_dates(df):
              if 'date' in df.columns:
                  d = pd.to_datetime(df['date'])
              elif 'Date' in df.columns:
                  d = pd.to_datetime(df['Date'])
              else:
                  d = pd.to_datetime(df.index)
              return d

          eq_dates = normalize_dates(eq)
          sp_dates = normalize_dates(sp)
          eq_col = next(c for c in ['equity','portfolio_equity','total_equity','value'] if c in eq.columns)
          sp_col = next(c for c in ['Close','close','Adj Close','adj_close','^GSPC'] if c in sp.columns)

          a = pd.DataFrame({'date': eq_dates, 'strategy_equity': pd.to_numeric(eq[eq_col], errors='coerce')}).dropna()
          b = pd.DataFrame({'date': sp_dates, 'sp500_level': pd.to_numeric(sp[sp_col], errors='coerce')}).dropna()
          m = a.merge(b, on='date', how='inner').sort_values('date')
          m['strategy_growth_100'] = 100*m['strategy_equity']/m['strategy_equity'].iloc[0]
          m['sp500_growth_100'] = 100*m['sp500_level']/m['sp500_level'].iloc[0]

          out = Path('benchmark_chart')
          out.mkdir(exist_ok=True)
          m.to_csv(out/'strategy_vs_sp500.csv', index=False)

          plt.figure(figsize=(10,5.8))
          plt.plot(m['date'], m['strategy_growth_100'], label='Pairs trading strategy')
          plt.plot(m['date'], m['sp500_growth_100'], label='S&P 500 benchmark')
          plt.axhline(100, linewidth=.8, linestyle='--')
          plt.xlabel('Date')
          plt.ylabel('Growth of $100')
          plt.title('Out-of-sample strategy performance versus S&P 500')
          plt.legend()
          plt.tight_layout()
          plt.savefig(out/'F19_equity_curve_vs_sp500.png', dpi=320, bbox_inches='tight')
          print('strategy_terminal', m['strategy_growth_100'].iloc[-1])
          print('sp500_terminal', m['sp500_growth_100'].iloc[-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-sp500-benchmark
          path: benchmark_chart/
