name: Research modules 01 through 11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/research_modules_01_11.yml]
permissions:
  contents: read
concurrency:
  group: historical-research-01-11
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  formation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebooks.txt
      - name: Modules 01 through 06
        run: >-
          python scripts/execute_notebooks.py
          01_Stock_Data.ipynb 01_RF_Data.ipynb 02_Pair_Selection.ipynb
          03_fractional_OU.ipynb 03_pair_eligibility.ipynb
          04_convergence_signal.ipynb 05_volatility_model.ipynb 06_option_pricing.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formation-notebooks-and-data
          path: |
            *.ipynb
            data/processed/current/
          retention-days: 30
  backtest:
    needs: formation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebooks.txt
      - uses: actions/download-artifact@v4
        with:
          name: formation-notebooks-and-data
          path: .
      - name: Module 07 backtest
        run: python scripts/execute_notebooks.py 07_backtest.ipynb
      - name: Publish backtest summary immediately
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('data/processed/current/backtest_summary.json')
          if p.exists():
              text=p.read_text()
              print(text)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Module 07 results\n```json\n'+text+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-07-notebooks-and-results
          path: |
            *.ipynb
            data/processed/current/
          retention-days: 30
  diagnostics:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebooks.txt
      - uses: actions/download-artifact@v4
        with:
          name: module-07-notebooks-and-results
          path: .
      - name: Modules 08 through 11
        run: >-
          python scripts/execute_notebooks.py
          08_drawdown_diagnostics.ipynb 09_systematic_risk_diagnostics.ipynb
          10_equilibrium_shift_diagnostics.ipynb 11_static_convergence_calibration.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modules-01-11-notebooks-and-results
          path: |
            *.ipynb
            data/processed/current/
          retention-days: 30
